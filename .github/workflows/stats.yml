name: Refresh stats

# Manual: Actions -> Refresh stats -> Run workflow. Read-only YouTube calls; rewrites content/stats.json
# with views and the status switches (public / processed / made-for-kids / restrictions) of every video.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel folder under channels/ (empty = the main channel), e.g. wild"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh content/stats.json
        env:
          YT_CHANNEL: ${{ inputs.channel }}
          YT_CLIENT_ID: ${{ inputs.channel == 'wild' && secrets.YT_CLIENT_ID_2 || (inputs.channel == '' && secrets.YT_CLIENT_ID) || '' }}
          YT_CLIENT_SECRET: ${{ inputs.channel == 'wild' && secrets.YT_CLIENT_SECRET_2 || (inputs.channel == '' && secrets.YT_CLIENT_SECRET) || '' }}
          YT_REFRESH_TOKEN: ${{ inputs.channel == 'wild' && secrets.YT_REFRESH_TOKEN_2 || (inputs.channel == '' && secrets.YT_REFRESH_TOKEN) || '' }}
        run: |
          if [ -z "$YT_CLIENT_ID" ] || [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::error::the YouTube key for channel '${YT_CHANNEL:-main}' is not set (secrets YT_CLIENT_ID${YT_CHANNEL:+_2} / YT_REFRESH_TOKEN${YT_CHANNEL:+_2})"
            exit 1
          fi
          python -m pipeline.stats
      - name: Commit
        run: |
          git config user.name "yt-autopilot"
          git config user.email "yt-autopilot@users.noreply.github.com"
          git add content/stats.json channels/*/content/stats.json 2>/dev/null || git add content/stats.json
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "records: stats refresh"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
