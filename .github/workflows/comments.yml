name: First comments

# Hourly: posts the channel's first comment (with the sister-channel line) on videos that went public
# since the last run, for both channels. Records the comment id in the video's record.
on:
  schedule:
    - cron: "50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      max-parallel: 1
      matrix:
        channel: ["", "wild"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post pending first comments
        env:
          YT_CHANNEL: ${{ matrix.channel }}
          YT_CLIENT_ID: ${{ matrix.channel == 'wild' && secrets.YT_CLIENT_ID_2 || secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ matrix.channel == 'wild' && secrets.YT_CLIENT_SECRET_2 || secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ matrix.channel == 'wild' && secrets.YT_REFRESH_TOKEN_2 || secrets.YT_REFRESH_TOKEN }}
        run: python -m pipeline.comments
      - name: Record comment ids
        run: |
          git config user.name "yt-autopilot"
          git config user.email "yt-autopilot@users.noreply.github.com"
          git add content/published channels/*/content/published
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "records: first comments"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
