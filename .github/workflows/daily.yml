name: Daily video

on:
  schedule:
    # One run about 50 minutes before each of the 10 release times in channel.yml (`release.shorts_slots`,
    # IST: 07:45, 17:30, 19:00, 20:30, 22:00, 23:30, 01:00, 02:30, 04:00, 05:30), so every video is made
    # and uploaded just before it goes public (the two videos that kept getting views during the 19-21 Oct
    # collapse were the two that went public within 30 min of upload). A run uploads only when YouTube's
    # rolling 24 h limit (10) has room and otherwise exits in seconds. GitHub starts cron jobs a few
    # minutes late; if a run misses its slot the video goes public ~25 min after upload instead
    # (`release.max_wait_hours`), so the rhythm never slips by more than one video.
    - cron: "25 1 * * *"
    - cron: "10 11 * * *"
    - cron: "40 12 * * *"
    - cron: "10 14 * * *"
    - cron: "40 15 * * *"
    - cron: "10 17 * * *"
    - cron: "40 18 * * *"
    - cron: "10 20 * * *"
    - cron: "40 21 * * *"
    - cron: "10 23 * * *"
  push:
    # Any change to the code or settings renders a test video (no upload) so mistakes show up early.
    paths:
      - "pipeline/**"
      - "channel.yml"
      - "assets/**"
      - ".github/workflows/daily.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only - do not upload, keep the idea in the queue"
        type: boolean
        default: false
      package:
        description: "Specific idea file to render (optional), e.g. content/queue/2026-10-15-doorway-effect.json"
        type: string
        default: ""
      count:
        description: "How many videos to make this run (optional; default = release.videos_per_run in channel.yml)"
        type: string
        default: ""
      publish_now:
        description: "Publish immediately instead of scheduling hourly slots"
        type: boolean
        default: false
      look:
        description: "Visual style for this run: footage or drawn (empty = channel.yml visuals.style)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  # Test renders (dry runs) run on their own so they are never cancelled by the posting queue.
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) && format('dry-run-{0}', github.run_id) || 'daily-video' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # the branch tip at the moment the job starts, not the run's old snapshot

      - name: Make sure we have the very latest queue and published records
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"
          echo "using $(git rev-parse --short HEAD)"

      - name: Read the channel's visual style
        run: |
          CFG=channel.yml
          LOOK=$(grep -E '^\s*style:\s*' "$CFG" | head -1 | sed -E 's/.*style:\s*//; s/[" #].*//')
          echo "CHANNEL_LOOK=${LOOK:-footage}" >> "$GITHUB_ENV"
          echo "channel look: ${LOOK:-footage}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        timeout-minutes: 8
        # A static build from GitHub (fast, reliable from a GitHub runner); apt only as the fallback. The
        # package mirrors stalled three times this week and each stall cost a video.
        run: |
          if command -v ffmpeg > /dev/null 2>&1 && ffmpeg -version > /dev/null 2>&1; then
            echo "ffmpeg already present"; ffmpeg -version | head -n 1; exit 0
          fi
          mkdir -p "$HOME/ffbin"
          if curl -fsSL --retry 3 --max-time 240 -o /tmp/ff.tar.xz \
               https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz; then
            tar -xJf /tmp/ff.tar.xz -C /tmp
            cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe "$HOME/ffbin/"
            echo "$HOME/ffbin" >> "$GITHUB_PATH"
            "$HOME/ffbin/ffmpeg" -version | head -n 1
          else
            for i in 1 2 3; do
              if sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; then break; fi
              echo "apt attempt $i failed; retrying in 20 s"; sleep 20
            done
            ffmpeg -version | head -n 1
          fi

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Drawing engine (only when the visual style is "drawn")
        # Stable Diffusion Turbo on the CPU: torch + diffusers (~1 GB of wheels, cached by pip) and the model
        # (~2.5 GB, cached below). Skipped entirely for the footage style.
        if: ${{ inputs.look == 'drawn' || contains(env.CHANNEL_LOOK, 'drawn') }}
        run: pip install -r requirements-draw.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Cache the drawing model
        if: ${{ inputs.look == 'drawn' || contains(env.CHANNEL_LOOK, 'drawn') }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: draw-model-sd-turbo-v1

      - name: Cache the offline voice model
        uses: actions/cache@v4
        with:
          path: .cache/tts
          key: tts-cache-${{ runner.os }}-${{ hashFiles('channel.yml') }}

      - name: Make and publish today's video
        id: make
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN: ${{ (github.event_name == 'push' || inputs.dry_run == true) && 'true' || 'false' }}
          PACKAGE: ${{ inputs.package }}
          COUNT: ${{ inputs.count }}
          NOW: ${{ inputs.publish_now == true && 'true' || 'false' }}
          VISUAL_STYLE: ${{ inputs.look }}
        run: |
          ARGS=""
          if [ "$NOW" = "true" ]; then ARGS="$ARGS --now"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$PACKAGE" ]; then ARGS="$ARGS --package $PACKAGE"; fi
          if [ -n "$COUNT" ]; then ARGS="$ARGS --count $COUNT"; fi
          python -m pipeline.run $ARGS

      - name: Save a contact sheet of a test render into the repository (so it can be reviewed without downloading)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        continue-on-error: true
        run: |
          mkdir -p content/previews
          for V in output/*/*.mp4; do
            [ -f "$V" ] || continue
            case "$(basename "$V")" in visual.mp4|scene*.mp4) continue;; esac
            NAME=$(basename "$(dirname "$V")")
            ffmpeg -y -loglevel error -i "$V" -vf "fps=1/4,scale=360:-2,tile=3x3" -frames:v 1 -q:v 4 "content/previews/${NAME}.jpg"
          done
          ls content/previews | head -50 | sort -r | tail -n +9 | while read OLD; do rm -f "content/previews/$OLD"; done
          git config user.name "yt-autopilot"
          git config user.email "yt-autopilot@users.noreply.github.com"
          git add content/previews
          if git diff --cached --quiet; then echo "no preview"; else
            git commit -m "preview: test render contact sheet"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}" || true
          fi

      - name: Keep the rendered video as a downloadable artifact (test renders only)
        # Scheduled runs upload to YouTube, so no copy is kept; test renders keep one for 3 days.
        # Never fails the run: artifact storage is a convenience, not part of publishing.
        if: ${{ always() && github.event_name != 'schedule' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            output/*/*.mp4
            output/*/thumbnail.jpg
            output/*/captions.ass
            output/summary.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Keep today's finished videos for cross-posting (Instagram, Reddit)
        # Uploaded videos are attached to a release named after the day (IST), so they can be downloaded on
        # a phone from the repository's Releases page and posted elsewhere by hand. Releases older than
        # 4 days are removed. Never fails the run.
        if: ${{ github.event_name == 'schedule' && steps.make.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          TAG="videos-$DAY"
          FILES=$(ls output/*/*.mp4 2>/dev/null || true)
          [ -z "$FILES" ] && { echo "no uploaded videos this run"; exit 0; }
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Videos of $DAY"               --notes "Finished videos of $DAY (India time), for posting to Instagram Reels / Reddit by hand. Removed after 4 days." || true
          fi
          gh release upload "$TAG" $FILES -R "$GITHUB_REPOSITORY" --clobber || true
          # prune old video releases
          for OLD in $(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '.[].tagName' | grep '^videos-' || true); do
            OLD_DAY=${OLD#videos-}
            if [ "$(date -d "$OLD_DAY" +%s)" -lt "$(date -d "$DAY -4 days" +%s)" ]; then
              gh release delete "$OLD" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            fi
          done

      - name: Summarise the run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          OUTCOME: ${{ steps.make.outcome }}
        run: |
          if [ -f output/summary.json ]; then
            SUMMARY=$(python - <<'PY'
          import json
          d = json.load(open("output/summary.json"))
          lines = []
          for v in d.get("videos", []):
              lines.append(f"- {v.get('status')}: **{v.get('title')}** ({v.get('duration_seconds')}s, voice={v.get('voice')}, footage={v.get('footage')})"
                           + (f" -> {v['url']} public at {v.get('goes_public_at')}" if v.get("url") else "")
                           + (f" | facebook: {v['facebook']}" if v.get("facebook") else ""))
          lines.append(f"- failed: {d.get('failed', 0)}")
          if d.get("error"):
              lines.append(f"- error: {d['error']}")
          if d.get("note"):
              lines.append(f"- note: {d['note']}")
          print("\n".join(lines))
          PY
          )
          else
            SUMMARY="- the run failed before a video was rendered (see the step log above)"
          fi
          printf '### yt-autopilot run %s (%s, %s)\n%s\n' "$GITHUB_RUN_NUMBER" "$EVENT" "$OUTCOME" "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" != "schedule" ] || [ "$OUTCOME" != "success" ]; then
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
              -f body="$(printf 'yt-autopilot run #%s (%s, %s)\n\n%s\n\n%s' "$GITHUB_RUN_NUMBER" "$EVENT" "$OUTCOME" "$SUMMARY" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")" > /dev/null || true
          fi

      - name: Record the result in the repository
        if: ${{ always() && github.event_name != 'push' && inputs.dry_run != true }}
        run: |
          git config user.name "yt-autopilot"
          git config user.email "yt-autopilot@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            TITLE=$(python -c "import json; d=json.load(open('output/summary.json')); v=[x for x in d.get('videos',[]) if x.get('status')=='uploaded']; print(('publish: ' + (v[0]['title'] if len(v)==1 else f'{len(v)} videos')) if v else 'records: stats and comments')" 2>/dev/null || echo "records: update")
            git commit -m "$TITLE"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
