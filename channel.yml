# ---------------------------------------------------------------------------
# Channel settings. Edit freely; the daily job reads this file every run.
# ---------------------------------------------------------------------------

channel:
  name: "Mind Unlocked"            # small label shown at the top of every video
  niche: >
    Mind-blowing, verified facts about psychology, the human body, space,
    science, history and animals — told as 30-50 second Shorts with a strong
    hook in the first 2 seconds.
  language: "en"                   # BCP-47 language of the voice/captions
  default_category_id: "27"        # 27 Education | 28 Science & Tech | 24 Entertainment | 22 People & Blogs
  privacy: "public"                # public | unlisted | private  (read README: "Why are my uploads private?")
  made_for_kids: false
  title_suffix: ""                 # e.g. " #Shorts" — appended to every title
  description_footer: |
    Follow for a new mind-blowing fact every day.
    Stock footage: Pixabay / Pexels.

# How videos are released. The job runs every 2 hours (see .github/workflows/daily.yml) and
# uploads whenever YouTube's rolling 24 h upload limit has room (`daily_limit`, 10 for this
# channel - it refused the 11th upload). Uploading and releasing are separate: every uploaded
# video is scheduled to go public at the next FREE time in its slot list below (release
# timezone), so a video uploaded at noon quietly waits as "Scheduled" until its slot.
# Release windows (India time): 4:30-6:30 PM, 6:30-9:30 PM and 10:30 PM-1:30 AM, nothing else.
# Daily plan = 1 long video (10:30 PM) + 9 Shorts on the half hour from 4:30 PM to 1:30 AM = 10.
# Before every upload the job counts the uploads of the last 24 h and waits for a free slot,
# so the cap is never hit. Raise daily_limit only when YouTube raises the channel's limit.
release:
  videos_per_run: 2                # per run; a run makes one extra when earlier runs were blocked (catch-up)
  interval_minutes: 60             # minimum spacing between two releases
  shorts_slots: ["16:30", "17:30", "18:30", "19:30", "20:30", "21:30", "23:30", "00:30", "01:30"]
  longform_slots: ["22:30"]        # the long video of the day opens the late window
  daily_limit: 10                  # starting value; content/limits.json keeps the live value, raised automatically by the weekly probe
  probe_limit: true                # once a week, try one upload beyond the limit to learn whether YouTube raised it
  lead_minutes: 20                 # a publish time is at least this many minutes after the upload
  timezone: "Asia/Kolkata"

# Long videos (16:9, 8-11 minutes): a themed list of 8-12 verified facts, one chapter each, from
# content/longform/queue/ (written by the long-form writer task, see AGENT_LONGFORM.md).
# One is made for every free `longform_slots` time at most `build_hours_ahead` hours ahead.
longform:
  enabled: true
  queue_target: 3                  # the writer keeps this many long videos ready
  build_hours_ahead: 24
  min_segments: 8
  max_segments: 12
  max_seconds: 900
  width: 1920
  height: 1080
  zoom: 0.05
  crf: 21
  preset: fast
  gap_seconds: 0.45
  progress_bar: false
  caption_font_size: 66
  words_per_group: 4
  max_chars_per_line: 26
  caption_y_percent: 84
  caption_outline_px: 6
  series_label: "Mind Unlocked"    # pill shown during the intro and outro
  thumbnail: true

# Sub-topics the idea generator rotates through (it avoids repeating the last few).
topics:
  - psychology
  - human body
  - space
  - science
  - history
  - animals

# The idea generator keeps this many ready-to-render ideas waiting in content/queue.
queue_target: 40

video:
  width: 1080
  height: 1920
  fps: 30
  max_seconds: 58                  # hard cap; Shorts can be up to 3 min but 30-50 s performs best
  gap_seconds: 0.25                # silence between scenes
  zoom: 0.08                       # slow push-in per scene (0 = off)
  progress_bar: true               # thin bar along the bottom that fills over the video
  crf: 20                          # quality (lower = better/bigger). 18-23 is sensible.

voice:
  engine: "auto"                   # auto = Microsoft neural voice (edge-tts), falls back to offline voice | edge | offline
  edge_voice: "en-US-AndrewNeural" # try: en-US-BrianNeural, en-US-ChristopherNeural, en-GB-RyanNeural, en-IN-PrabhatNeural
  edge_rate: "+6%"
  loudness_lufs: -19               # overall loudness of the finished video. YouTube's own level is about -14; lower = quieter/softer
  offline_voice: "vits-piper-en_US-ryan-medium"   # any vits-piper-* model from the sherpa-onnx tts-models release
  offline_speed: 0.8

captions:
  font_file: "assets/fonts/Poppins-ExtraBold.ttf"
  font_name: "Poppins ExtraBold"
  font_size: 104
  uppercase: true
  words_per_group: 3
  max_chars_per_line: 14
  text_color: "#FFFFFF"
  highlight_color: "#FFD400"       # the word currently being spoken
  outline_px: 8
  y_percent: 56                    # vertical centre of the captions (0 = top, 100 = bottom)
  show_top_label: true             # small pill near the top
  day_counter: true                # pill reads "DAY 12 • SPACE" (streak since the first upload) instead of the channel name

music:
  enabled: true                    # uses a random file from assets/music/ (mp3/m4a/wav); silent if the folder is empty
  volume: 0.10

cta:
  spoken: true                     # used by the "classic" style only
  text: "Follow for a new fact every day."
  end_text: "Follow for more"      # small label in the last second of a "punch" style video
  first_comment_enabled: false     # off: posting comments needs the extra YouTube permission (see README step 3)
  first_comment: "Which fact should we cover next? 👇"   # fallback when an idea has no question of its own

# A/B test of the two video styles (see pipeline/run.py build_video): classic = word-by-word
# captions from the first word + spoken call-to-action; punch = full hook sentence on screen for
# the first scene, no spoken CTA, ends on the punchline. Uploads alternate while this is on;
# content/stats.json shows average views per style under "by_style".
experiment:
  alternate_styles: true

thumbnail:
  enabled: true                    # generated 1080x1920 image; YouTube needs a phone-verified channel to accept it (non-fatal)
  background: "#0B1020"
  accent: "#FFD400"
